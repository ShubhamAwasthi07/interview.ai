spring.application.name=interview-ai

# Local dev: load secrets from a git-ignored .env file in the project root, if present
spring.config.import=optional:file:.env[.properties]

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/interview_ai
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Mail Config
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


spring.jpa.hibernate.ddl-auto=update


jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Actuator: expose only the health endpoint, without component details
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false
